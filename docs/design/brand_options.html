<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Albright – header brand options</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4f6;--bar:#ffffff;--line:#e2e5ea;--ink:#111827;--muted:#6b7280;--card:#fff;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b0d10;--bar:#14161a;--line:rgba(255,255,255,.08);--ink:#e6e8eb;--muted:#8b93a1;--card:#111317;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0d10;--bar:#14161a;--line:rgba(255,255,255,.08);--ink:#e6e8eb;--muted:#8b93a1;--card:#111317;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:24px 20px 80px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:22px;margin:0;font-weight:600}
.intro{color:var(--muted);margin:4px 0 26px}
.toggle{font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
.toggle:focus-visible{outline:2px solid #facc15;outline-offset:2px}
.opt{margin-bottom:40px}
.opt h2{font-size:17px;margin:0 0 4px;font-weight:600}
.opt > p{margin:0 0 12px;color:var(--muted);font-size:14px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:flex;align-items:center;gap:20px;padding:12px 18px;background:var(--bar);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.bar .nav{margin-left:auto;display:flex;gap:18px;color:var(--muted);font-size:14px;white-space:nowrap}
@media (max-width:640px){.bar .nav{display:none}}
.app-fitness{--a:#ca8a04;--as:rgba(202,138,4,.14)} .app-meals{--a:#ea580c;--as:rgba(234,88,12,.12)} .app-trade{--a:#0284c7;--as:rgba(2,132,199,.12)}
:root[data-theme="dark"] .app-fitness{--a:#facc15;--as:rgba(250,204,21,.14)} :root[data-theme="dark"] .app-meals{--a:#fb923c;--as:rgba(251,146,60,.14)} :root[data-theme="dark"] .app-trade{--a:#38bdf8;--as:rgba(56,189,248,.14)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .app-fitness{--a:#facc15;--as:rgba(250,204,21,.14)} :root:not([data-theme="light"]) .app-meals{--a:#fb923c;--as:rgba(251,146,60,.14)} :root:not([data-theme="light"]) .app-trade{--a:#38bdf8;--as:rgba(56,189,248,.14)}}
.logo{display:block;height:var(--h,40px);width:auto}
.logo.w{display:none}
:root[data-theme="dark"] .logo.w{display:block} :root[data-theme="dark"] .logo.d{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo.w{display:block} :root:not([data-theme="light"]) .logo.d{display:none}}
.brand{display:flex;align-items:center;gap:12px;white-space:nowrap;flex-shrink:0}
.ico{width:16px;height:16px;flex-shrink:0}
/* A divider lockup */
.A .div{width:1px;height:26px;background:var(--line)}
.A .name{font-size:13px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--ink)}
/* B stacked */
.B .stack{display:flex;flex-direction:column;line-height:1.1}
.B .sup{font-size:10px;font-weight:600;letter-spacing:.32em;color:var(--muted)}
.B .name{font-size:18px;font-weight:700;color:var(--a)}
/* C chip */
.C .chip{display:inline-flex;align-items:center;gap:6px;background:var(--as);color:var(--a);border-radius:999px;padding:4px 11px 4px 9px;font-size:13px;font-weight:600}
/* D badge */
.D .mark{position:relative}
.D .badge{position:absolute;right:-6px;bottom:-4px;width:22px;height:22px;border-radius:50%;background:var(--a);display:grid;place-items:center;color:#111;box-shadow:0 0 0 3px var(--bar)}
.D .badge .ico{width:13px;height:13px}
.D .name{font-size:15px;font-weight:600;color:var(--muted);margin-left:6px}
/* E breadcrumb */
.E .crumb{display:flex;align-items:center;gap:8px;font-size:16px}
.E .crumb .base{color:var(--muted);font-weight:500}
.E .crumb .sep{color:var(--line);font-weight:300;font-size:20px}
.E .crumb .name{color:var(--ink);font-weight:600}
.E .crumb .dot{width:7px;height:7px;border-radius:50%;background:var(--a)}
</style>
</head>

<script>
const apps=[["fitness","Fitness"],["meals","Meals"],["trade","Trading"]];
const L=document.getElementById('logoTpl').innerHTML;
const ico=k=>`<svg class="ico"><use href="#i-${k}"/></svg>`;
const opts=[
 ["A","A: Divider lockup","Logo, a thin divider, then the app name in small spaced capitals. Clean and premium, like a product family (Apple, Google).",
   (k,n)=>`<div class="brand" style="--h:38px">${L}<span class="div"></span><span class="name">${n}</span></div>`],
 ["B","B: Stacked wordmark","A small spaced 'ALBRIGHT' over the app name in the app's color. Reads as one branded name and clearly colors each app.",
   (k,n)=>`<div class="brand" style="--h:40px">${L}<div class="stack"><span class="sup">ALBRIGHT</span><span class="name">${n}</span></div></div>`],
 ["C","C: App chip","The app shown as a small tinted pill with its icon. Compact and very clear about which app you're in.",
   (k,n)=>`<div class="brand" style="--h:36px">${L}<span class="chip">${ico(k)}${n}</span></div>`],
 ["D","D: Badge on the logo","A small colored app icon badge on the logo's corner, with the name in quiet gray. Like an app icon with a notification dot.",
   (k,n)=>`<div class="brand" style="--h:40px"><span class="mark">${L}<span class="badge">${ico(k)}</span></span><span class="name">${n}</span></div>`],
 ["E","E: Breadcrumb","A smaller logo, then 'Albright / Fitness' with a color dot. Shows where you are in the family of apps.",
   (k,n)=>`<div class="brand" style="--h:30px">${L}<div class="crumb"><span class="base">Albright</span><span class="sep">/</span><span class="dot"></span><span class="name">${n}</span></div></div>`],
];
const root=document.getElementById('opts');
opts.forEach(([cls,t,desc,fn])=>{const s=document.createElement('section');s.className='opt '+cls;
  s.innerHTML=`<h2>${t}</h2><p>${desc}</p><div class="bars">`+apps.map(([k,n])=>`<div class="bar app-${k}">${fn(k,n)}<nav class="nav"><span>Today</span><span>Workouts</span><span>Programs</span></nav></div>`).join('')+`</div>`;root.appendChild(s);});
const b=document.getElementById('themeBtn');
b.addEventListener('click',()=>{const t=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',t);b.textContent=t==='dark'?'Switch to light mode':'Switch to dark mode';});
</script>
