{% comment %}One line of the form's Checklist editor (form.html): row = {"pk", "text", "grocery"} or None for the empty line at the end. A grocery row's text is the grocery line's - read only.{% endcomment %}
<li class="pl-cl-edit__row" draggable="true"><span class="pl-cl-edit__grip" aria-hidden="true">&#x2807;</span><input type="hidden" name="cl_id" value="{{ row.pk|default:'' }}"><input type="text" name="cl_text" value="{{ row.text|default:'' }}" class="pl-input pl-cl-edit__text" maxlength="200" aria-label="Checklist item" placeholder="{% if row %}Checklist item{% else %}Add an item{% endif %}"{% if row.grocery %} readonly title="A line on the Meals grocery list"{% endif %}><button type="button" class="pl-cl-edit__btn" data-cl-move="-1" aria-label="Move up">&uarr;</button><button type="button" class="pl-cl-edit__btn" data-cl-move="1" aria-label="Move down">&darr;</button><button type="button" class="pl-cl-edit__btn" data-cl-delete aria-label="Delete item">&times;</button></li>
