{% extends "index.html" %}

{% block content %}
<div class="container" style="padding-top: 60px; padding-bottom: 48px; max-width: 440px;">

    {% if registered %}

        <div class="card" style="text-align: center;">
            <div class="card__header" style="justify-content: center;">
                <span class="card__label">Registration Complete</span>
            </div>
            <p style="color: var(--text-secondary); margin-bottom: 20px;">
                Thank you for registering!
            </p>
            <a href="/user_login/" class="btn btn-primary" style="width: 100%; display: inline-block; box-sizing: border-box;">
                Log In
            </a>
        </div>

    {% else %}

        <div class="card">
            <div class="card__header"><span class="card__label">Create an Account</span></div>

            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="field">
                    <label for="username">Username</label>
                    <input id="username" type="text" name="username" placeholder="Enter Username" autocomplete="username" required>
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" type="email" name="email" placeholder="Enter Email" autocomplete="email" required>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input id="password" type="password" name="password" placeholder="Enter Password" autocomplete="new-password" required>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 4px;">Register</button>
            </form>

            <div style="text-align: center; margin-top: 18px; font-size: 0.8125rem; color: var(--text-secondary);">
                or <a href="/user_login/">Log In</a>
            </div>
        </div>

    {% endif %}

</div>
{% endblock %}
