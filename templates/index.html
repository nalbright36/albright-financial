{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <link rel="stylesheet" href="{% static 'style.css' %}">
        <link rel="stylesheet" href="{% static 'queries2.css' %}">
        <link rel="stylesheet" href="{% static 'css/finance-ledger.css' %}">
        <title>Albright Financial</title>
        <link rel="icon" type="image/x-icon" href="{% static 'images/Favicon2.png' %}">
    </head>

    <body>

        <nav class="navbar">
            <a href="/" class="navbar__brand">Albright Financial</a>

            <div class="navbar__links">
                <a href="/">Home</a>
                {% if user.is_authenticated %}
                <a href="/trading_account">Trading Account</a>
                <a href="/market_scanner">Market Scanner</a>
                <a href="/strategies">Strategies</a>
                <a href="{% url 'user_logout' %}">Logout</a>
                {% else %}
                <a href="/user_login">Login</a>
                <a href="/registration">Register</a>
                {% endif %}
            </div>
        </nav>

        {% block content %}
        {% endblock %}

    </body>
</html>
