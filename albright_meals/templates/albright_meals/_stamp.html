{% comment %}Another member of my household's stamp (r: a RecipeRating): their emoji and initial; tap for their label and note (static/meals/ratings.js). Only ever rendered for my own household's members.{% endcomment %}<button type="button" class="meals-stamp meals-stamp--{{ r.color }}" data-stamp="{{ r.user.first_name|default:r.user.username }}: {{ r.emoji }} {{ r.get_level_display }}{% if r.note %} - &ldquo;{{ r.note }}&rdquo;{% endif %}" aria-label="{{ r.user.first_name|default:r.user.username }}: {{ r.get_level_display }}{% if r.note %}, {{ r.note }}{% endif %}"><span aria-hidden="true">{{ r.emoji }}</span><span class="meals-stamp__initial" aria-hidden="true">{{ r.user.first_name|default:r.user.username|slice:":1"|upper }}</span></button>
