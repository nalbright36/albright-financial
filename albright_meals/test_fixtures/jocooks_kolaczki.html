      "description": "Tender, buttery Polish Kolaczki just like the ones I grew up with every Christmas.",

      "recipeIngredient": [
        "8 ounces cream cheese (softened)",
        "1 cup unsalted butter (softened)",
        "2 cups all-purpose flour",
        "¼ teaspoon salt",
        "½ cup fruit preserves (apricot, raspberry, or plum are traditional)",
        "¼ cup powdered sugar (for dusting)"
      ],
      "recipeInstructions": [
        {"@type": "HowToStep", "text": "In a large bowl, beat 8 ounces cream cheese and 1 cup butter until smooth and creamy. Add 2 cups flour and ¼ teaspoon salt and mix until a dough forms."},
        {"@type": "HowToStep", "text": "Shape the dough into a disc, wrap in plastic wrap, and refrigerate for at least 1 hour (or up to overnight)."},
        {"@type": "HowToStep", "text": "Preheat oven to 350 °F (175 °C). Line two baking sheets with parchment paper."},
        {"@type": "HowToStep", "text": "On a lightly floured surface, roll the chilled dough to about ⅛ inch thick. Cut into 2½-inch squares using a pastry wheel or knife."},
        {"@type": "HowToStep", "text": "Place ½ teaspoon fruit preserves in the center of each square. Fold two opposite corners over the filling, slightly overlapping, and pinch to seal."},
        {"@type": "HowToStep", "text": "Arrange cookies on the prepared sheets, spacing slightly apart. Bake 12 to 15 minutes, or until lightly golden at the edges."},
        {"@type": "HowToStep", "text": "Cool on a wire rack, then dust generously with powdered sugar before serving."}
      ]
    }
