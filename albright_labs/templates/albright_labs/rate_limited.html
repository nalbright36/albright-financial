{% extends "index.html" %}
{% block page_title %}Too many attempts · {% endblock %}
{% block content %}
<div class="container" style="padding-top: 60px; padding-bottom: 48px; max-width: 440px;">
    <div class="card" id="rate-limited">
        <div class="card__header"><span class="card__label">Too many attempts</span></div>
        <p style="margin: 0;">Please wait {{ minutes }} minutes and try again.</p>
        <p style="margin: 16px 0 0; font-size: 0.8125rem;"><a href="{% url 'user_login' %}" style="color: var(--text-secondary);">Back to sign in</a></p>
    </div>
</div>
{% endblock %}
