<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Albright Labs</title></head>
<body style="margin:0; padding:0; background:#F1F5F9; font-family:-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color:#0F172A;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F1F5F9; padding:24px 12px;">
<tr><td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px; background:#FFFFFF; border-radius:12px; border:1px solid #E2E8F0;">
<tr><td style="padding:20px 28px; border-bottom:1px solid #E2E8F0;">
    <span style="font-size:16px; font-weight:700; letter-spacing:0.02em; color:#0F172A;">Albright Labs</span>
</td></tr>
<tr><td style="padding:24px 28px; font-size:15px; line-height:1.55;">
{% block body %}{% endblock %}
{% if link %}
<p style="margin:24px 0;"><a href="{{ link }}" style="display:inline-block; background:#2563EB; color:#FFFFFF; text-decoration:none; font-weight:600; padding:12px 22px; border-radius:8px;">{{ button }}</a></p>
<p style="margin:0 0 4px; font-size:13px; color:#475569;">Or paste this link into your browser:</p>
<p style="margin:0; font-size:13px; word-break:break-all;"><a href="{{ link }}" style="color:#2563EB;">{{ link }}</a></p>
{% endif %}
{% block after %}{% endblock %}
</td></tr>
<tr><td style="padding:16px 28px; border-top:1px solid #E2E8F0; font-size:12px; color:#64748B;">
    Albright Labs &middot; <a href="{{ site_url }}" style="color:#64748B;">{{ site_url }}</a>
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
